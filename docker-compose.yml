services:
  resume-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: resume-agent:latest
    container_name: resume-agent
    restart: unless-stopped
    # 敏感配置放在同目录 .env（已在 .gitignore / .dockerignore 中），不要提交到仓库
    env_file:
      - .env
    environment:
      # 同域托管前端产物（Dockerfile 已设为 1）
      SERVE_STATIC: "1"
      # 跨域来源：同域部署可保持 *；前后端分开部署时填前端域名
      CORS_ORIGINS: "*"
      TZ: Asia/Shanghai
      # 容器内用服务名 redis 访问（environment 优先级高于 env_file 的 .env）
      REDIS_URL: redis://redis:6379/0
    ports:
      # 只暴露本机端口，由 Nginx 对外提供 HTTPS
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      redis:
        condition: service_healthy

    # Celery 正式化后必需:app 与两个 worker 共享数据卷——
    # .upload 文件传递、解析产物、知识库索引更新都落在 /app/data
    # (首次需把镜像内 data/ 的内容复制到 ./runtime-data,否则挂载会遮盖内置知识库)
    volumes:
      - ./runtime-data:/app/data

  redis:
    image: redis:7-alpine
    container_name: resume-agent-redis
    restart: unless-stopped
    # 检索结果缓存可丢、可随时重建，故不挂数据卷；
    # 不对外暴露 ports，仅 compose 内部网络可达（resume-agent 通过服务名 redis 访问）
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker-resume:
    # 简历解析消费者:复用 resume-agent 的镜像(不单独 build);
    # DATABASE_URL 由 env_file 的 .env 提供(生产库外置,无需覆盖)
    image: resume-agent:latest
    container_name: resume-agent-worker-resume
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      REDIS_URL: redis://redis:6379/0
    volumes:
      # 必须与 app 同挂一个数据卷:消息只传 .upload 路径字符串,文件本体走共享卷
      - ./runtime-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A src.worker.celery_app worker --loglevel=info -Q resume --concurrency=2

  worker-knowledge:
    # 知识库构建消费者:concurrency=1 串行化(写共享索引文件不可并行)
    image: resume-agent:latest
    container_name: resume-agent-worker-knowledge
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./runtime-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A src.worker.celery_app worker --loglevel=info -Q knowledge --concurrency=1
