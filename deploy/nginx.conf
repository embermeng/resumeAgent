# ResumeAgent 反向代理配置
# 放置到服务器 /etc/nginx/conf.d/resume-agent.conf，把 server_name 换成你的域名
#
# 关键点：
#   1. proxy_buffering off  —— SSE 流式输出必须关闭缓冲
#   2. proxy_read_timeout   —— 简历生成为长任务，默认 60s 会被 Nginx 掐断
#   3. client_max_body_size —— 上传已有简历（docx/pdf）
#   4. auth_basic           —— 项目本身无鉴权，用它兜住 /admin 构建入口，防止别人烧你的 Token

upstream resume_agent {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name your-domain.com;

    client_max_body_size 20m;

    # 访问口令（可选但强烈建议）：
    #   sudo apt install -y apache2-utils
    #   sudo htpasswd -bc /etc/nginx/.htpasswd admin '你的密码'
    # auth_basic "ResumeAgent";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    # ---- API（SSE 必须关缓冲、放长超时）----
    location /api/ {
        proxy_pass http://resume_agent;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering    off;
        proxy_cache        off;
        gzip               off;
        chunked_transfer_encoding on;

        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # ---- 前端静态资源（带指纹，可长缓存）----
    location /assets/ {
        proxy_pass http://resume_agent;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ---- SPA 页面 ----
    location / {
        proxy_pass http://resume_agent;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/resume-agent.access.log;
    error_log  /var/log/nginx/resume-agent.error.log;
}
